name: release

# Publishes sheperd and its four sheperd-<os>-<arch> sandbox packages to npm (docs/RELEASING.md).
# Publishes only from a v* tag whose version matches npm/sheperd/package.json: on the tag push,
# or on a manual dispatch from that tag with dry-run unticked. Every other run (a dry-run
# dispatch, or a pull request that touches the packaging) builds, packs and smoke-tests only.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - npm/**
      - scripts/npm/**
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build, pack and smoke-test only; never publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Release binaries are built with exactly this toolchain, never "whatever stable is today".
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - id: plan
        name: Decide whether this run publishes
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          version=$(node -p 'require("./npm/sheperd/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag=""
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match npm/sheperd/package.json version $version"
              exit 1
            fi
          fi
          publish=false
          if [ "$EVENT" = push ] && [ -n "$tag" ]; then
            publish=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; then
            if [ -z "$tag" ]; then
              echo "::error::publishing needs a v* tag: dispatch this workflow from the tag v$version"
              exit 1
            fi
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sheperd $version: publish=$publish (event $EVENT, ref ${REF_TYPE}:${REF_NAME})"

  sandbox:
    name: sandbox (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          # macos-14 and macos-13 are retired runner images; macos-15 is arm64 and
          # macos-15-intel is the x64 replacement.
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          # Linux builds run on the oldest supported Ubuntu so the binary links against an old
          # glibc (a 24.04 build needs glibc 2.39, which excludes Ubuntu 22.04 and Debian 12).
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Rust toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          if command -v rustup >/dev/null; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          # Every later cargo/rustc call in this job uses the pinned toolchain.
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Release builds are never served from a cache.
      - name: Build rewire-sandbox --release (local paths remapped)
        run: node scripts/npm/build.mjs sandbox

      - name: Stage sheperd-${{ matrix.target }}
        run: |
          node scripts/npm/build.mjs platform --target "${{ matrix.target }}" --out dist-npm
          ./dist-npm/sheperd-${{ matrix.target }}/rewire-sandbox --version
          if [ "$RUNNER_OS" = Linux ]; then
            need=$(objdump -T "dist-npm/sheperd-${{ matrix.target }}/rewire-sandbox" \
              | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "the binary needs glibc $need or newer"
            # README promises glibc 2.35 (Ubuntu 22.04, Debian 12 has 2.36).
            if [ "$(printf '%s\n2.35\n' "$need" | sort -V | tail -1)" != 2.35 ]; then
              echo "::error::rewire-sandbox needs glibc $need, newer than the supported 2.35"
              exit 1
            fi
          fi
          rustc --version
          # File list and local-path check on this runner, where the paths that must not leak
          # (this home directory and checkout) are known.
          node scripts/npm/build.mjs check --out dist-npm
          # upload-artifact drops the executable bit; a tar keeps it.
          tar -C dist-npm -cf "sheperd-${{ matrix.target }}.tar" "sheperd-${{ matrix.target }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-${{ matrix.target }}
          path: sheperd-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [plan, sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sandbox-*
          path: artifacts
          merge-multiple: true

      - name: Unpack the platform packages
        run: mkdir -p dist-npm && for f in artifacts/*.tar; do tar -xf "$f" -C dist-npm; done

      # After the binaries: the bundle records each one's sha256 and refuses any other.
      - run: node scripts/npm/build.mjs sheperd --all-platforms --out dist-npm

      - name: Check and pack all five packages
        run: node scripts/npm/build.mjs pack --all-platforms --out dist-npm

      - name: Smoke-test the packed tarballs (install, install -g, --help, doctor, tamper)
        run: node scripts/npm/smoke.mjs --tarballs dist-npm/tarballs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: dist-npm/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

  # Only this job can publish, and it runs no repository code: it publishes the tarballs the
  # package job checked and smoke-tested. It runs in the npm-publish environment, which holds
  # NPM_TOKEN and must be limited to v* tags with a required reviewer (docs/RELEASING.md).
  publish:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # GitHub creates an unknown environment on the fly, with no protection; refuse to publish
      # from one, or without the token.
      - name: Require a protected npm-publish environment and its NPM_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          fail() { echo "::error::$1 (see docs/RELEASING.md, one-time setup)"; exit 1; }
          env_json=$(gh api "repos/$REPO/environments/npm-publish") \
            || fail "cannot read the npm-publish environment"
          reviewers=$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<<"$env_json")
          [ "$reviewers" -gt 0 ] || fail "the npm-publish environment has no required reviewer"
          [ "$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<<"$env_json")" = true ] \
            || fail "the npm-publish environment is not limited to selected tags"
          tags=$(gh api "repos/$REPO/environments/npm-publish/deployment-branch-policies" \
            --jq '.branch_policies[] | select(.type == "tag") | .name') \
            || fail "cannot read the npm-publish deployment policies"
          grep -qx 'v\*' <<<"$tags" || fail "the npm-publish environment does not allow the tag pattern v*"
          [ "$HAS_TOKEN" = true ] || fail "NPM_TOKEN is not set in the npm-publish environment"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: tarballs

      # A version already on the registry is skipped only when it is byte-for-byte these
      # tarballs (a re-run after a partial publish). Anything else, e.g. a squatted or hijacked
      # sheperd-<os>-<arch>@<version>, fails the job before sheperd is published.
      - name: npm publish (platform packages first, then sheperd) with --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          packages="sheperd-darwin-arm64 sheperd-darwin-x64 sheperd-linux-x64 sheperd-linux-arm64 sheperd"
          local_sri() { echo "sha512-$(openssl dgst -sha512 -binary "tarballs/$1-$VERSION.tgz" | openssl base64 -A)"; }
          # Prints the registry's dist.integrity for $1@$VERSION, or nothing when it is not
          # published; any other registry error fails.
          registry_sri() {
            local out err
            err=$(mktemp)
            if out=$(npm view "$1@$VERSION" dist.integrity 2>"$err"); then
              echo "$out"
            elif grep -q E404 "$err"; then
              echo ""
            else
              cat "$err" >&2
              echo "::error::npm view $1@$VERSION failed"
              return 1
            fi
          }
          check_all() { # $1 = "before" or "after"
            local bad=0 name want got
            for name in $packages; do
              want=$(local_sri "$name")
              got=$(registry_sri "$name")
              if [ -z "$got" ]; then
                if [ "$1" = after ]; then
                  echo "::error::$name@$VERSION is not on the registry after publishing"
                  bad=1
                else
                  echo "$name@$VERSION: not published yet"
                fi
              elif [ "$got" = "$want" ]; then
                echo "$name@$VERSION: registry integrity matches the local tarball"
              else
                echo "::error::$name@$VERSION on the registry ($got) is not the local tarball ($want)"
                bad=1
              fi
            done
            return "$bad"
          }
          check_all before
          for name in $packages; do
            # Re-compare right before each publish: a version that appeared after
            # `check_all before` must match byte for byte, or nothing more is published.
            got=$(registry_sri "$name")
            if [ -z "$got" ]; then
              npm publish "tarballs/$name-$VERSION.tgz" --provenance --access public --tag next
            elif [ "$got" = "$(local_sri "$name")" ]; then
              echo "$name@$VERSION is already published with this exact tarball; skipping"
            else
              echo "::error::$name@$VERSION appeared on the registry with different contents ($got); stopping before publishing anything else"
              exit 1
            fi
          done
          # The registry can take a moment to serve a new version.
          for attempt in 1 2 3 4 5 6; do
            if check_all after; then exit 0; fi
            echo "registry not consistent yet (attempt $attempt); retrying in 20s"
            sleep 20
          done
          echo "::error::the registry does not serve exactly the published tarballs"
          exit 1
