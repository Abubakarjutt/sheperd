name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  SEMGREP_VERSION: 1.186.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install bubblewrap and ripgrep (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which
          # breaks bwrap. The sandbox tests need them, so lift the restriction on this runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: |
          python -m pip install --user pipx
          python -m pipx install "semgrep==${SEMGREP_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)  asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ;;
            Linux-ARM64) asset="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" ;;
            macOS-ARM64) asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" ;;
            macOS-X64)  asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz" ;;
            *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -O "$base/$asset"
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > check.txt
          if command -v sha256sum >/dev/null; then sha256sum -c check.txt; else shasum -a 256 -c check.txt; fi
          tar -xzf "$asset" gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          semgrep --version
          gitleaks version
          rg --version
          git --version

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - run: cargo test --workspace
      - run: cargo build --release -p rewire-sandbox

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm biome check .
      - run: pnpm -r test
        env:
          REWIRE_SANDBOX_BIN: ${{ github.workspace }}/target/release/rewire-sandbox
